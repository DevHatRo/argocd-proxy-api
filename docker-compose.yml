# Local run. Build the binaries first: ./scripts/build.sh
# Settings and credentials come from .env (see env.example); .env is gitignored.
services:
  argocd-proxy-api:
    image: argocd-proxy-api:local
    platform: linux/amd64
    build:
      context: .
      args:
        TARGETARCH: amd64
    ports:
      - "5001:5001"
    env_file: .env
    restart: unless-stopped
